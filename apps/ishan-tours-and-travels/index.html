<title>Ishan Tours Hub</title>

.home>p{margin-top:24px;color:var(--gl);font-size:1.05rem}
.sheet{padding:0;overflow:hidden}
.sh-top{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--nv),var(--n2));color:#fff;padding:18px 20px}

.gold{height:5px;background:linear-gradient(90deg,var(--r),var(--gd) 50%,var(--r))}
.body{padding:18px 20px}

.box p:last-child{border:0}.box i{font-style:normal;color:#5f7a70}.box span{font-weight:600;text-align:right}
.wrap{overflow-x:auto}
table.items{width:100%;border-collapse:collapse;font-size:.9rem}

.rb{display:flex;justify-content:space-between;font-weight:700;margin:0 14px 12px;color:var(--n2)}
.rtb{width:calc(100% - 28px);margin:0 14px;border-collapse:collapse;border:2px solid var(--nv);font-size:.82rem}
.rtb th,.rtb td{border:1px solid #bccdc5;padding:8px 5px;text-align:center;font-weight:600}

.rf{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin:60px 14px 0}
.cl{flex:1}.cl small{display:block;color:#5f7a70;font-size:.9rem;margin-bottom:46px}

@media(max-width:560px){.rh{padding:14px 12px;gap:12px}.rh img{width:76px;height:76px}.rh h1{font-size:1.2rem}.rh p{font-size:.76rem}.rt{font-size:1.05rem;letter-spacing:2px}.rtb{font-size:.66rem}.stamp{font-size:.78rem}.rf{flex-direction:column;align-items:stretch}.cl small{margin-bottom:34px}}

.cl{flex:0 1 50%}
.rc.duty{padding-bottom:0}

.sigs{display:flex;justify-content:space-between;gap:20px;margin:70px 14px 0}

.dfoot{margin-top:26px;background:var(--nv);color:var(--gd);text-align:center;font-size:.72rem;letter-spacing:1.5px;padding:11px;border-top:4px solid var(--gd)}

</style></head><body>
<nav class="no-print">
<button data-t="tracker">📅 MONTHLY BILL</button>
<button data-t="invoice">🧾 INVOICE</button>
<button data-t="duty">📝 DUTY INVOICE</button>
<button data-t="home" class="act">🏠 HOME</button>
</nav>
<main>
<section id="home" class="on"><div class="card home"><div class="hdr"></div><p>Select a tool from the top to begin.</p></div></section>

<section id="invoice">
<div class="card tf inv no-print"><h2 class="it">🚖 Invoice Maker</h2>
<label>Date<input id="i_date" type="date"></label>
<label>Customer Name<input id="i_cust" placeholder="e.g. Rahul Sharma"></label>
<div class="two"><label>From<input id="i_from" placeholder="Thane"></label><label>To<input id="i_to" placeholder="Pune"></label></div>
<label>Cab No.<input id="i_cab" placeholder="MH 04 AB 1234"></label>
<hr>
<label>Cab Service Amount (₹)<input id="i_amt" type="number" step="any" inputmode="decimal" value="0"></label>
<label>Toll / Parking (₹)<input id="i_toll" type="number" step="any" inputmode="decimal" value="0"></label>
<div class="tfare" id="i_tot">Total Fare:</div>
<button class="b red full" onclick="mkInv()">🖨️ Create Invoice</button>
<button class="b grn full" style="margin-top:10px" onclick="sharePDF()">📤 Share PDF</button></div>
<div class="card rcwrap" id="ivw" style="display:none"><div class="rc" id="iv"></div></div>
<div class="card no-print" id="ivb" style="display:none"><button class="b grn full" onclick="print()">Print / Save PDF</button><button class="b grn full" onclick="sharePDF()">📤 Share PDF</button></div>
</section>

<section id="duty">
<div class="card no-print"><h2>Duty invoice</h2><div class="grid" id="dform"></div>
<div class="btns"><button class="b" onclick="print()">Print / Save as PDF</button><button class="b" onclick="sharePDF()">📤 Share PDF</button><button class="b g" onclick="newDuty()">New duty invoice</button></div></div>
<div class="card rcwrap"><div class="rc duty" id="dv"></div></div>
</section>

<section id="tracker">

		}

	},

	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}

		return new QRPolynomial(num, 0).mod(e);
	}

		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {

		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;

		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}

		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}

		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

module.exports = QRCode;

</script><script>/* Print: shrink the bill to fit ONE A4 page, and make "Print / Save PDF" work inside the Android app */
(function(){
var W=718,H=1020,cur=null,T0=document.title;
function pdfName(){
 var id=(document.querySelector("section.on")||{}).id,m={invoice:["i_cust","i_date"],duty:["d_cust","d_date"],tracker:["v_client","v_date"]}[id];
 if(!m)return T0;
 var nm=(document.getElementById(m[0])||{}).value||"",dt=(document.getElementById(m[1])||{}).value||"";
 nm=nm.replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"");
 var x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dt);dt=x?x[3]+"-"+x[2]+"-"+x[1].slice(2):dt.replace(/\//g,"-");
 return (nm+dt)||T0;
}
function setT(){document.title=pdfName()}function resetT(){document.title=T0}
function fit(){
 var rc=document.querySelector("section.on .rc");if(!rc||!rc.parentElement)return;
 var par=rc.parentElement,ps=par.style.cssText,z=1;
 par.style.cssText=ps+";width:"+W+"px;padding:0;margin:0;border-top:0;box-sizing:border-box";
 rc.style.zoom=1;
 for(var i=0;i<8;i++){var h=par.offsetHeight;if(h<=H)break;z=Math.max(.4,z*H/h*.97);rc.style.zoom=z}
 par.style.cssText=ps;cur=rc;
}
function reset(){if(cur){cur.style.zoom="";cur=null}}

function cp(src){var d=src.cloneNode(false);
 if(src.nodeType===1){var cs=getComputedStyle(src),t="";for(var i=0;i<cs.length;i++)t+=cs[i]+":"+cs.getPropertyValue(cs[i])+";";d.setAttribute("style",t);
  for(var c=src.firstChild;c;c=c.nextSibling)d.appendChild(cp(c))}
 return d}
function mkPDF(jpg,iw,ih,w,h){
 var PW=595.28,PH=841.89,m=18,sc=Math.min((PW-2*m)/w,(PH-2*m)/h),dw=w*sc,dh=h*sc,x=(PW-dw)/2,y=PH-m-dh;
 var enc=new TextEncoder(),parts=[],off=[],len=0,i;
 function add(b){if(typeof b==="string")b=enc.encode(b);parts.push(b);len+=b.length}
 function obj(n,b){off[n]=len;add(n+" 0 obj\n"+b+"\nendobj\n")}
 add("%PDF-1.4\n");
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");
 obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
 obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>");
 off[4]=len;add("4 0 obj\n<</Type/XObject/Subtype/Image/Width "+iw+"/Height "+ih+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpg.length+">>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
 var c="q "+dw.toFixed(2)+" 0 0 "+dh.toFixed(2)+" "+x.toFixed(2)+" "+y.toFixed(2)+" cm /Im0 Do Q";
 obj(5,"<</Length "+c.length+">>\nstream\n"+c+"\nendstream");
 var xr=len;add("xref\n0 6\n0000000000 65535 f \n");
 for(i=1;i<=5;i++)add(String(off[i]).padStart(10,"0")+" 00000 n \n");
 add("trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xr+"\n%%EOF");

function buildPDF(){return new Promise(function(ok,no){
 var rc=document.querySelector("section.on .rc");
 if(!rc||!rc.parentElement.offsetWidth||!rc.innerHTML.trim()){no(new Error("Create the bill first, then share."));return}
 var par=rc.parentElement,ps=par.style.cssText,clone,w,h,txt=(rc.innerText||"").replace(/\n{2,}/g,"\n").trim(),tm=setTimeout(function(){no(new Error("Timed out while drawing the bill"))},20000);
 reset();par.style.cssText=ps+";width:718px;padding:0;margin:0;border-top:0;box-sizing:border-box";rc.style.zoom=1;
 try{w=rc.offsetWidth;h=rc.offsetHeight;clone=cp(rc)}finally{par.style.cssText=ps;rc.style.zoom=""}
 clone.style.zoom="1";
 var xml=new XMLSerializer().serializeToString(clone),
 svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject x="0" y="0" width="100%" height="100%">'+xml+'</foreignObject></svg>',
 im=new Image();
 im.onload=function(){try{
  var S=2,cv=document.createElement("canvas");cv.width=w*S;cv.height=h*S;
  var g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
  var du=cv.toDataURL("image/jpeg",.92),b=atob(du.split(",")[1]),u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  clearTimeout(tm);ok({blob:mkPDF(u,cv.width,cv.height,w,h),img:du,text:txt})}catch(e){no(e)}};

 im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
function toast(t,ms){var d=document.getElementById("pdfToast");if(!d){d=document.createElement("div");d.id="pdfToast";d.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font:600 14px sans-serif;z-index:99999;max-width:90%;text-align:center";document.body.appendChild(d)}
 d.textContent=t;d.style.display="block";clearTimeout(d._t);if(ms)d._t=setTimeout(function(){d.style.display="none"},ms)}

 document.body.appendChild(o);

window.sharePDF=function(){
 toast("Creating PDF…");
 try{if((document.querySelector("section.on")||{}).id==="invoice")mkInv(true)}catch(e){}
 buildPDF().then(function(r){
  var fn=pdfName()+".pdf",f;
  if(window.AndroidShare&&AndroidShare.sharePdf){var fr=new FileReader();fr.onload=function(){document.getElementById("pdfToast").style.display="none";AndroidShare.sharePdf(String(fr.result).split(",")[1],fn)};fr.readAsDataURL(r.blob);return}
  try{f=new File([r.blob],fn,{type:"application/pdf"})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){toast("",1);return navigator.share({files:[f],title:pdfName()}).then(function(){toast("",1);document.getElementById("pdfToast").style.display="none"})}
  document.getElementById("pdfToast").style.display="none";fallback(r,fn)
